[package]
name = "smb-rs"
version = "0.1.0"
edition = "2021"
description = "NES (NROM) emulator + Super Mario Bros. reverse-engineering toolchain, in Rust"
license = "MIT"

[dependencies]
minifb = "0.29"
png = "0.17"
cpal = { version = "0.15", optional = true }

[features]
default = ["audio"]
audio = ["dep:cpal"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "smb-rs"
path = "src/main.rs"

[[bin]]
name = "nesdump"
path = "src/bin/nesdump.rs"
